<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>canvas-helper · 课程资料</title>
  <link rel="stylesheet" href="courses.css"><link rel="stylesheet" href="materials.css">
  <script type="module" src="materials.js"></script>
</head>
<body>
  <main class="materials-workspace">
    <header class="materials-header"><div><a id="backLink" class="back-link">返回课程总览</a><h1 id="courseTitle">课程资料</h1><p id="courseSubtitle">按章节选择 PDF、PPT 和 Word 文件</p></div><div class="header-actions"><button id="scanBtn" class="button secondary" type="button">刷新资料</button><button id="scanStopBtn" class="button quiet" type="button" hidden>停止扫描</button></div></header>
    <p id="status" class="materials-status" role="status" aria-live="polite">正在连接 Canvas…</p>
    <p id="downloadNotice" class="materials-status" role="status" aria-live="polite" hidden></p>
    <section class="file-filters" aria-label="查找课程资料"><label class="file-search"><span class="sr-only">搜索文件或章节</span><input id="searchInput" type="search" placeholder="搜索文件或章节…" autocomplete="off"></label><label class="type-field">类型<select id="typeFilter"><option value="">全部</option><option value="PDF">PDF</option><option value="PPT">PPT</option><option value="Word">Word</option></select></label></section>
    <div class="selection-tools"><label><input id="selectAll" type="checkbox"> <span id="selectAllLabel">显示的文件全选</span></label><div><button id="expandBtn" class="text-button" type="button">全部展开</button><button id="collapseBtn" class="text-button" type="button">全部收起</button></div></div>
    <div id="chapterList"></div>
    <section id="emptyState" class="empty-state" hidden><h2 id="emptyTitle">没有匹配的文件</h2><p id="emptyText">可更换搜索词或文件类型。</p></section>
    <section class="external-section" aria-labelledby="externalHeading"><div class="external-heading"><h2 id="externalHeading">外部链接 <span id="linkCount">0 条</span></h2><button id="linksToggle" class="text-button" type="button" aria-expanded="false" aria-controls="externalList">查看清单</button><button id="exportLinksBtn" class="text-button" type="button" disabled>导出链接清单</button></div><div id="externalList" hidden></div></section>
    <section id="archivePanel" class="archive-panel" hidden aria-labelledby="archiveHeading"><h2 id="archiveHeading">下载任务</h2><p id="archiveStatus" role="status" aria-live="polite"></p><progress id="downloadProgress" value="0" max="100" aria-label="文件下载进度"></progress><ul id="downloadResults"></ul><p class="session-note">保留本页可继续下载或重试失败文件。</p></section>
    <p class="materials-note">资料来自本课程的 Modules 及其 Canvas 内容页面。读取期间请保持原 Canvas 标签页打开。</p>
  </main>
  <footer class="download-bar"><div class="download-bar-inner"><div class="selection-summary"><button id="selectedBtn" class="text-button" type="button">已选 0 个文件</button><span id="selectedSize"></span><label><input id="includeLinks" type="checkbox" checked> <span id="includeLinksLabel">附带本课程的外部链接清单</span></label></div><div class="download-actions"><button id="clearBtn" class="button quiet" type="button">清空选择</button><button id="retryBtn" class="button secondary" type="button" hidden>继续 / 重试失败</button><button id="downloadBtn" class="button primary" type="button" disabled>下载所选</button><button id="stopBtn" class="button secondary" type="button" hidden>停止下载</button></div></div></footer>
</body>
</html>
