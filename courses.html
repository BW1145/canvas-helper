<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>canvas-helper · 课程总览</title>
    <link rel="stylesheet" href="courses.css">
    <script type="module" src="courses.js"></script>
  </head>
  <body>
    <main class="workspace">
      <header id="appToolbar" class="toolbar">
        <a class="brand" href="#courseList" aria-label="canvas-helper，跳到课程列表"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="M4 4h6a3 3 0 0 1 2 1 3 3 0 0 1 2-1h6v16h-6a3 3 0 0 0-2 1 3 3 0 0 0-2-1H4zM12 5v16" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>canvas-helper</a>
        <label class="term-field"><span class="sr-only">查看学期</span><select id="termSelect" disabled><option value="">正在读取课程…</option></select></label>
        <label class="search-field"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7"/></svg><span class="sr-only">搜索课程名称或编号</span><input id="courseSearch" type="search" placeholder="搜索课程名称或编号" autocomplete="off"></label>
        <button id="refreshBtn" type="button" class="button secondary" disabled>刷新</button>
        <button id="stopBtn" type="button" class="button quiet" hidden>停止</button>
      </header>
      <div id="overviewLayout" class="overview-layout" data-reading="false">
        <section id="listColumn" class="list-column" aria-labelledby="listHeading">
          <div class="list-heading"><h1 id="listHeading">我的课程 <span id="courseCount">0 门</span></h1><p id="status" role="status" aria-live="polite">正在连接 Canvas…</p></div>
          <p id="scopeNotice" class="scope-notice" hidden></p>
          <label class="sr-only" for="progress">课程整理进度</label><progress id="progress" max="100" value="0">0%</progress>
          <div id="listLabels" class="list-labels" aria-hidden="true"><span>课程名称</span><span>Panopto 视频</span><span>快捷入口</span></div>
          <ul id="courseList" class="course-list" aria-label="课程列表" tabindex="-1"></ul>
          <section id="emptyState" class="empty-state"><h2 id="emptyTitle">正在读取课程列表</h2><p id="emptyText">课程介绍和视频状态会显示在这里。</p><button id="clearSearchBtn" class="button secondary" type="button" hidden>清空搜索</button></section>
          <p class="list-note">点击课程名称查看完整介绍。读取期间请保持 Canvas Dashboard 打开。</p>
        </section>
        <aside id="courseReader" class="course-reader" aria-labelledby="readerTitle" tabindex="-1" hidden>
          <div class="reader-navigation">
            <button id="closeReaderBtn" class="button quiet" type="button"><span aria-hidden="true">←</span> 返回课程</button>
            <div class="reader-pagination"><span id="readerPosition"></span><button id="prevCourseBtn" class="button icon-button" type="button" aria-label="上一门课程">‹</button><button id="nextCourseBtn" class="button icon-button" type="button" aria-label="下一门课程">›</button></div>
          </div>
          <header class="reader-header">
            <div class="reader-meta"><span id="readerCode"></span><span id="readerTerm"></span></div>
            <h2 id="readerTitle" tabindex="-1"></h2>
            <div class="reader-tools"><span id="readerVideo" class="video-badge"></span><div id="readerLinks" class="reader-links"></div></div>
            <p id="readerVideoMessage" class="video-message" hidden></p>
            <button id="readerRetryBtn" class="button secondary retry-button" type="button" hidden>重试这门课程</button>
          </header>
          <section class="reader-body" aria-labelledby="introHeading">
            <div class="intro-heading"><h3 id="introHeading">课程介绍</h3><a id="readerSource" target="_blank" rel="noopener noreferrer" hidden>查看原文</a></div>
            <div id="readerDescription" class="course-description"></div>
          </section>
        </aside>
      </div>
    </main>
  </body>
</html>
